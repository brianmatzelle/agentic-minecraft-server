# Sunshine — game-stream the Spark's desktop to Moonlight on the iPhone.
#
# WHY THESE VALUES (this box is unusual — a DGX Spark, GB10, aarch64):
#
#   capture — X11, and since the 2026-08-17 KMS reboot that WORKS. This build
#     rejects an explicit `capture` key ("Unrecognized configurable option
#     [capture]"), so Sunshine picks; it logs "Screencasting with X11" (its KMS
#     grab never engages — "Couldn't load EGL library" in this image). That is
#     fine: the fix below turned out to repair X11 capture itself, not to
#     switch backends. With nvidia-drm modeset=1 the root window has readable
#     pixels again (xwd -root: 8.3M nonzero bytes of 11M, was 0).
#
#     RESOLVED BLOCKER (measured 2026-07-23, fixed 2026-08-17 by the modeset
#     reboot): X11 capture of this display returned a
#     100% BLACK frame, so a Moonlight client would stream black. Evidence,
#     with the display awake (xset "Monitor is On", nvidia-smi "Display
#     Active: Enabled", CRTC 0 driving 2560x1080 on USB-C-0):
#         xwd -root                -> 0 nonzero bytes out of 4,000,000
#         xwd -id <chromium win>   -> 1,993,743 nonzero bytes out of 2,000,000
#     i.e. individual windows hold their pixels but the ROOT window is empty.
#     Ruled out, each retested with a forced repaint (workspace toggle):
#         - the compositor: picom killed AND confirmed absent -> still black
#         - DPMS/screen blank: forced on + `xset s off`       -> still black
#         - the game: Minecraft moved off the workspace       -> still black
#         - shm/uid: capture as root and as uid 1000          -> both black
#     So this is the NVIDIA X driver not backing the root window with readable
#     scanout, not a Sunshine bug and not something config can fix.
#
#     THE FIX (applied 2026-08-17): as root,
#         edit /etc/modprobe.d/zz-nvidia-drm-override.conf -> modeset=1
#         update-initramfs -u && reboot
#     We expected this to enable KMS capture; in practice Sunshine stayed on
#     X11 but modeset=1 made the NVIDIA X driver back the root window with
#     readable scanout, which was the actual disease. `cap_add: [SYS_ADMIN]`
#     stays on this service in case Sunshine's KMS grab ever does engage.
#
#   encoder = nvenc
#     Verified working on the GB10: h264_nvenc encoded 1280x720@30 at 4.4x
#     realtime inside a --gpus all container.
#
# The stream reaches the phone over TAILSCALE (spark-4933 100.126.150.5 →
# iphone171 100.120.0.72, direct path, ~41ms) — no router port forward, which
# matters because this router's UDP forwarding has never worked (see the
# Simple Voice Chat revert).
#
# CAVEAT: this captures the PHYSICAL desktop on seat0. Streaming it means the
# ultrawide shows the same picture and injected input lands in the same i3
# session. Fine while nobody is sitting at the Spark; it is not a private
# second seat.

sunshine_name = Garvis Spark

# --- capture + encode -------------------------------------------------------
encoder = nvenc

# --- web UI -----------------------------------------------------------------
# MUST be `wan`, and that is not laziness. Sunshine buckets a request as
# pc / lan / wan by source address, and Tailscale hands out 100.64.0.0/10 —
# RFC6598 shared address space, NOT RFC1918 — so it does not count as "lan".
# Measured on this box with origin_web_ui_allowed = lan:
#     curl https://127.0.0.1:47990/       -> 307   (pc, allowed)
#     curl https://100.126.150.5:47990/   -> 403   (tailnet, refused)
# Every device that would ever administer or pair (phone, iPad, MacBook)
# arrives over the tailnet, so `lan` would leave pairing possible only from a
# browser on the Spark itself.
#
# SECURITY: with network_mode: host this login page is reachable from the home
# LAN and the tailnet (the public IP is not port-forwarded). The username and
# password are therefore the only thing guarding it — set a real one, see
# ./README.md.
origin_web_ui_allowed = wan

# --- persistence ------------------------------------------------------------
# MUST be explicit. Sunshine otherwise puts state under $HOME/.config/sunshine,
# and HOME is /home/lizard (baked into the upstream image) — a path inside the
# container with no volume behind it. Every `compose up --build` would then
# regenerate the TLS cert and drop the pairing, so the phone would have to be
# re-paired each time. These land in the sunshine-config volume instead.
file_state = /config/sunshine_state.json
credentials_file = /config/sunshine_credentials.json
pkey = /config/credentials/cakey.pem
cert = /config/credentials/cacert.pem

min_log_level = info
