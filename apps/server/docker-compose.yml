# Modded Minecraft — NeoForge 1.21.x — itzg/minecraft-server
# Layer 1 of the architecture (the actual game server). This is a NORMAL
# container exposed on TCP 25565 — it does NOT run inside OpenShell (OpenShell
# is egress-only and cannot host an inbound game listener). See docs/architecture.md.
#
# Quickstart:  cp .env.example .env  &&  edit .env  &&  docker compose up -d
# Custom seed: set LEVEL_SEED in .env (only takes effect on first world gen).
# Console:     docker compose exec minecraft rcon-cli   (or: mc-send-to-console)

services:
  minecraft:
    image: itzg/minecraft-server:java21
    container_name: mc-neoforge
    tty: true
    stdin_open: true
    restart: unless-stopped
    stop_grace_period: 120s                    # give the modded server up to 2m to save+shut down on stop/reboot (default is 10s)
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"                              # accepts https://aka.ms/MinecraftEULA
      TYPE: "NEOFORGE"
      VERSION: "${MC_VERSION:-1.21.1}"          # target MC version
      # NeoForge loader build. NOT "latest": NeoForge enforces loader-build EQUALITY in
      # the config handshake — a server on 21.1.243 rejects a 21.1.242 client outright
      # ("Incompatible client! Please use NeoForge <build>"), so an unpinned server that
      # drifts to the newest Maven build locks out everyone on the published client pack.
      # Keep this equal to `dependencies.neoforge` in apps/client/modrinth.index.json,
      # which the pack builder pins to the newest build meta.prismlauncher.org has
      # mirrored (Prism can't install a build it hasn't mirrored — see scripts/build-client-mrpack.mjs).
      NEOFORGE_VERSION: "${NEOFORGE_VERSION:-latest}"
      MEMORY: "${MC_MEMORY:-12G}"               # heap; Aikar flags set Xms=Xmx. 12G is a healthy modded heap on this 128G box (bigger ≠ better — large heaps lengthen GC pauses)
      SEED: "${LEVEL_SEED:-}"                   # <-- custom world seed (blank = random)
      MOTD: "${MC_MOTD:-A NeoForge server, maintained by Garvis}"
      DIFFICULTY: "${MC_DIFFICULTY:-normal}"
      MAX_PLAYERS: "${MC_MAX_PLAYERS:-20}"
      # Command blocks (server.properties enable-command-block). Lets ops place/run
      # command blocks for redstone contraptions, datapack-style automation, etc.
      # Only operators can place or edit them, so this doesn't widen who can run
      # commands — it just unlocks the in-world block for the existing ops.
      ENABLE_COMMAND_BLOCK: "${MC_ENABLE_COMMAND_BLOCK:-true}"
      # --- Render / simulation distance (applied to server.properties; OVERRIDE_SERVER_PROPERTIES re-applies on restart) ---
      # view-distance = chunks of terrain SENT to clients (what you see). Cheap-ish; max 32.
      # simulation-distance = chunks that actually TICK (entities/mob-spawning/redstone/crops).
      #   This is the TPS-sensitive one and is single-thread-CPU-bound, NOT RAM-bound — more
      #   heap does not raise its ceiling. Lowered 20 -> 12 (2026-06-25) in response to player
      #   reports of server lag: fewer ticking chunks per player directly relieves the
      #   single-thread tick budget, the usual cause of slowness on an entity-heavy modded
      #   server (Cobblemon). 12 still beats vanilla's 10. Profile with `spark` to confirm the
      #   real bottleneck before tuning further (raise back toward 20 if TPS has headroom).
      # view-distance lowered 32 -> 16 at the same time: trims terrain chunks loaded/sent
      #   (memory + chunk-gen + network), still a generous render range well above vanilla 10.
      # Briefly tried 24 (2026-06-29) for longer-range "cinematic" terrain, then reverted to
      #   16 the same day: it's the cheaper distance knob (terrain sent/loaded, not ticked) but
      #   still costs memory + chunk-gen + bandwidth per player, and we have NO server-perf
      #   monitoring yet — can't make a potentially destructive change blind. Revisit raising
      #   it once spark/metrics are in place to watch heap + chunk-gen under a full lobby.
      VIEW_DISTANCE: "${MC_VIEW_DISTANCE:-16}"
      SIMULATION_DISTANCE: "${MC_SIMULATION_DISTANCE:-12}"
      # Operators live in server-data/ops.json (persists across restarts). Op/de-op
      # in-game, from the console, or via Garvis — changes stick. No env-driven rewrite.
      # --- Whitelist (only listed players may join) ---
      WHITELIST: "${MC_WHITELIST:-}"            # comma-separated usernames; setting this turns white-list on
      ENFORCE_WHITELIST: "TRUE"                 # kick players who get removed from the list, even mid-session
      OVERRIDE_WHITELIST: "TRUE"                # rewrite whitelist.json from MC_WHITELIST each start (repo is source of truth)
      # --- Server resource pack (Faithful 32x) — pushed to EVERY client on join ---
      # itzg writes these to server.properties (resource-pack / -sha1 / -prompt /
      # require-resource-pack). The vanilla client auto-downloads the .zip straight
      # from Modrinth's CDN and applies it, so every friend gets the same crisp
      # HD-vanilla textures with ZERO client setup — no mod, no client-pack regen,
      # works alongside the modded textures. This is purely a server.properties push;
      # OVERRIDE_SERVER_PROPERTIES=true re-applies it on restart.
      #
      # To change the look: point MC_RESOURCE_PACK at another pack's Modrinth file URL
      # and MC_RESOURCE_PACK_SHA1 at that file's sha1 — the sha1 MUST match the bytes
      # at the URL or clients reject the download. (Resolve both from the Modrinth API
      # the same way scripts/build-client-mrpack.mjs resolves mod files.)
      # ENFORCE=true makes the pack apply on join (declining disconnects you) so the
      # whole server looks uniform; set MC_RESOURCE_PACK_ENFORCE=false for a softer,
      # non-blocking "recommended" prompt instead. Blank MC_RESOURCE_PACK to disable.
      RESOURCE_PACK: "${MC_RESOURCE_PACK:-https://cdn.modrinth.com/data/w0TnApzs/versions/ruZOIEZE/Faithful%2032x%20-%201.21.1.zip}"
      RESOURCE_PACK_SHA1: "${MC_RESOURCE_PACK_SHA1:-cf90d965473549d3d642b835071c6472d60bcf7b}"
      RESOURCE_PACK_ENFORCE: "${MC_RESOURCE_PACK_ENFORCE:-true}"
      # NOTE: vanilla parses resource-pack-prompt as a JSON text component, NOT plain
      # text — a bare string logs "Failed to parse resource pack prompt" at boot and
      # falls back to the generic prompt (the pack still downloads/applies either way).
      # So this is hardcoded JSON, ASCII-only (server.properties is ISO-8859-1, so an
      # em-dash would mangle). Edit the inner "text" to change the message.
      RESOURCE_PACK_PROMPT: '{"text":"mc.starting.cc recommends Faithful 32x - crisp HD-vanilla textures"}'
      # --- Mods from Modrinth (auto-downloaded at startup) ---
      MODRINTH_PROJECTS: "${MODRINTH_PROJECTS:-}"
      # mc-image-helper's per-request HTTP read timeout (ISO-8601), default PT30S.
      # 30s is too tight when Modrinth's API is degraded-but-alive (2026-07-18:
      # project lookups took 30-45s+ during an incident → ReadTimeoutException →
      # container crash-looped and the server stayed DOWN until Modrinth recovered,
      # since every boot re-resolves the whole modlist). 5m rides out slow spells.
      FETCH_RESPONSE_TIMEOUT: "PT5M"
      # MUST stay "none". With "required", itzg re-resolves every listed mod's
      # required dependencies to their LATEST compatible build and UPGRADES over
      # any explicit version pin — e.g. the Cobblemon add-ons (SimpleTMs etc.)
      # declare Cobblemon as required, so itzg dragged our pinned cobblemon 1.7.1
      # back up to 1.7.3 on each recreate (boot log: "cobblemon (1.7.1 -> 1.7.3)"),
      # silently re-breaking client/server parity → the recurring join rejections.
      # Our modlist.txt already lists EVERY required dep explicitly (verified: all
      # installed jars map 1:1 to a listed slug), so "none" drops nothing and makes
      # the modlist + its :versionId pins the single source of truth.
      MODRINTH_DOWNLOAD_DEPENDENCIES: "none"
      # Some mods publish their STABLE builds on Modrinth's "alpha"/"beta" release
      # channel (CC: Tweaked is the classic case — all its uploads are channel=alpha).
      # itzg defaults to release-only and would reject them, so accept alpha+ here.
      # itzg still selects the newest version COMPATIBLE with this MC + loader.
      MODRINTH_ALLOWED_VERSION_TYPE: "${MODRINTH_ALLOWED_VERSION_TYPE:-alpha}"
      # --- Extra mods by direct URL (itzg downloads each into /data/mods at startup) ---
      # Used for SERVER-ONLY mods that aren't on Modrinth. Currently: OUR FORK of the cpburnz
      # prometheus-exporter mod (server-side only — does NOT go in the client modpack and
      # won't affect client parity, same as spark). The fork adds a mc_player_ping_seconds
      # gauge (per-player keep-alive round-trip latency) on top of the stock heap/GC + TPS/MSPT/
      # chunks/entities/players. It exposes a /metrics HTTP endpoint on port 19565 INSIDE this
      # container. That port is deliberately NOT published in `ports:` below — only the
      # Prometheus sidecar reaches it over the internal compose network, so metrics are never
      # exposed off-box.
      #   Fork:     github.com/brianmatzelle/minecraft-prometheus-exporter (branch add-player-ping-metric)
      #   Upstream: github.com/cpburnz/minecraft-prometheus-exporter
      # To bump: rebuild the fork against the new MC+loader, cut a release, swap the URL below.
      MODS: "${MODS:-https://github.com/brianmatzelle/minecraft-prometheus-exporter/releases/download/1.21.1-neoforge-1.2.1-ping1/Prometheus-Exporter-1.21.1-neoforge-1.2.1-ping1.jar}"
      # --- Optional CurseForge modpack ---
      # AUTO_CURSEFORGE: "true"
      # CF_API_KEY: "${CF_API_KEY:-}"
      USE_AIKAR_FLAGS: "true"                   # GC tuning recommended for modded
      OVERRIDE_SERVER_PROPERTIES: "true"        # re-apply env-driven props on restart
      # --- Mod-config patches (./patches, mounted below) ---
      # itzg applies every patch file in this directory on each container start,
      # $set-ing individual keys inside mod configs under /data — so mod settings
      # live in the REPO instead of hand-edits to gitignored server-data/.
      # Currently: computercraft-server.json raises CC: Tweaked's max monitor size
      # 8x6 -> 20x20 ([term_sizes.monitor] width/height in computercraft-server.toml;
      # CC's hard cap is 32); customdiscs-server.json widens the Custom Discs music
      # zone 64 -> 128 blocks (audio.maxAudibleDistance in config/
      # customdiscs-server.toml; broadcastRadius 144 keeps the default +16 download
      # head-start margin). Custom Discs writes that file to /data/config, NOT
      # /data/world/serverconfig — it registers a COMMON-type config, so it is
      # world-independent (verified on the live server 2026-07-23; targeting the
      # serverconfig path made the patch a silent permanent no-op). It generates on
      # the first boot WITH the mod, so the patch lands from the second start onward
      # (itzg skips patches whose target file is missing).
      # NOTE: the rewrite keeps values (incl. the ordered
      # garvtunnel http.rules) but strips comments/formatting from the patched toml
      # (itzg docs: "processed output is not pretty").
      PATCH_DEFINITIONS: "/patches"
      # --- RCON (internal only — port 25575 is NOT published in `ports:`) ---
      # Already enabled by default on this image (that's how `rcon-cli` works); declared
      # explicitly now because the backups sidecar below connects over RCON to flush +
      # pause world saves for a consistent snapshot. The in-container socket used by
      # `docker compose exec minecraft rcon-cli` and Garvis (whitelist/moderation) is
      # unaffected by this password. Set a strong RCON_PASSWORD in .env — the default is
      # kept only for back-compat and the port is never reachable off-host.
      ENABLE_RCON: "true"
      RCON_PASSWORD: "${RCON_PASSWORD:-minecraft}"
    volumes:
      - ./server-data:/data                     # world + mods + logs (gitignored)
      - ./patches:/patches:ro                   # mod-config patch definitions (see PATCH_DEFINITIONS above)

  # --- World backups (local) -------------------------------------------------
  # itzg/mc-backup sidecar (same author as the server image). Connects over RCON to run
  # save-off + save-all before archiving and save-on after, so each .tgz is a consistent
  # snapshot of the world. Archives land on the host in ./backups (gitignored). This is the
  # FAST same-box rollback copy; the backups-offsite sidecar below is the disaster-recovery
  # copy that survives the host disk dying. See docs/backups.md for restore steps.
  backups:
    image: itzg/mc-backup
    container_name: mc-backup
    restart: unless-stopped
    depends_on:
      minecraft:
        condition: service_healthy             # wait for the server's healthcheck before connecting RCON
    environment:
      RCON_HOST: minecraft                      # reach the server by its compose service name (internal network)
      RCON_PASSWORD: "${RCON_PASSWORD:-minecraft}"   # MUST match the minecraft service above
      BACKUP_INTERVAL: "${BACKUP_INTERVAL:-24h}"     # daily, matching infra/k8s/values.yaml
      PRUNE_BACKUPS_DAYS: "${BACKUP_PRUNE_DAYS:-7}"  # delete local archives older than N days
      PAUSE_IF_NO_PLAYERS: "true"               # skip the snapshot when nobody is online (no idle churn)
      BACKUP_METHOD: tar                         # plain .tgz archives — restore = extract over /data
      TZ: "${TZ:-UTC}"                           # timezone for backup-filename timestamps
    volumes:
      - ./server-data:/data:ro                   # read the live world, read-only — the sidecar never writes here
      - ./backups:/backups                       # archives written here on the host

  # --- World backups (offsite, encrypted) ------------------------------------
  # Second itzg/mc-backup sidecar, restic method → S3 bucket garvis-mc-backups-430842105371
  # (us-east-2, AWS account 430842105371, IAM user garvis-mc-backup scoped to just that bucket).
  # Same RCON save-off/flush/save-on dance as the local sidecar, but restic dedupes + encrypts
  # client-side (RESTIC_BACKUP_PASSWORD) and uploads only changed blocks — so the first run ships
  # the whole ~11G world and every run after is tiny. This is the DISASTER-RECOVERY copy (survives
  # the host disk dying); the local tar sidecar above stays the fast same-box rollback. Creds + the
  # repo password live in .env (gitignored) — lose RESTIC_BACKUP_PASSWORD and the repo is
  # unrecoverable, so it's saved off-host too. Restore steps: docs/backups.md.
  backups-offsite:
    image: itzg/mc-backup
    container_name: mc-backup-offsite
    restart: unless-stopped
    depends_on:
      minecraft:
        condition: service_healthy             # wait for the server's healthcheck before connecting RCON
    environment:
      RCON_HOST: minecraft                      # reach the server by its compose service name (internal network)
      RCON_PASSWORD: "${RCON_PASSWORD:-minecraft}"   # MUST match the minecraft service above
      BACKUP_INTERVAL: "${BACKUP_INTERVAL:-24h}"     # daily; naturally offset from the local sidecar (started later)
      PAUSE_IF_NO_PLAYERS: "true"               # skip the snapshot when nobody is online (no idle churn)
      BACKUP_METHOD: restic                      # encrypted + deduplicated + incremental (auto-inits the repo)
      # restic repo lives at s3://<bucket>/world via the REGIONAL endpoint — an explicit region avoids
      # the 301 redirect a non-us-east-1 bucket returns on the global s3.amazonaws.com endpoint.
      RESTIC_REPOSITORY: "s3:s3.${AWS_BACKUP_REGION}.amazonaws.com/${RESTIC_S3_BUCKET}/world"
      RESTIC_PASSWORD: "${RESTIC_BACKUP_PASSWORD:?set RESTIC_BACKUP_PASSWORD in .env}"
      AWS_ACCESS_KEY_ID: "${AWS_BACKUP_ACCESS_KEY_ID:?set AWS_BACKUP_ACCESS_KEY_ID in .env}"
      AWS_SECRET_ACCESS_KEY: "${AWS_BACKUP_SECRET_ACCESS_KEY:?set AWS_BACKUP_SECRET_ACCESS_KEY in .env}"
      AWS_DEFAULT_REGION: "${AWS_BACKUP_REGION}"
      # retention applied by `restic forget --prune` after each run: 7 daily + 5 weekly + 6 monthly
      PRUNE_RESTIC_RETENTION: "--keep-daily 7 --keep-weekly 5 --keep-monthly 6"
      TZ: "${TZ:-UTC}"                           # timezone for snapshot timestamps
    volumes:
      - ./server-data:/data:ro                   # read the live world, read-only — never writes here
      - restic-cache:/var/cache/restic           # persist restic's local cache across restarts (faster runs)

  # --- Metrics: Prometheus (time-series DB) ----------------------------------
  # Scrapes the prometheus-exporter mod inside the minecraft container (port 19565,
  # internal network only) every 15s and stores the history. Config + scrape labels
  # live in ./monitoring/prometheus/prometheus.yml. Retention is capped so the box
  # never fills up. No host port is published by default (Grafana queries it over the
  # internal network); uncomment the 127.0.0.1 mapping to reach the Prometheus UI via
  # an SSH tunnel when debugging scrape targets.
  prometheus:
    image: prom/prometheus:latest              # pin to a tested tag (e.g. v3.x) after first good boot
    container_name: mc-prometheus
    restart: unless-stopped
    depends_on:
      minecraft:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=1y        # keep a full year of history (box has the disk; this metric set is only ~hundreds of MB/yr)
      - --storage.tsdb.retention.size=10GB      # disk backstop; at this data rate the 1y time cap is the binding limit, not size
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    # ports:
    #   - "127.0.0.1:9090:9090"                 # localhost-only; `ssh -L 9090:localhost:9090 box` to view

  # --- Metrics: Grafana (dashboards) -----------------------------------------
  # Auto-provisioned with the Prometheus datasource and the "Minecraft — Server
  # Performance" dashboard (see ./monitoring/grafana). Bound to 127.0.0.1 ONLY — there
  # is no auth story for off-box exposure yet, so reach it with an SSH tunnel:
  #   ssh -L 3000:localhost:3000 <this-box>   then open http://localhost:3000
  # Login admin / ${GRAFANA_ADMIN_PASSWORD} (set a real one in .env).
  grafana:
    image: grafana/grafana:latest              # pin to a tested tag after first good boot
    container_name: mc-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"                  # localhost-only by design (no public exposure)

  # --- Conversation log: Postgres --------------------------------------------
  # Durable, queryable store for Garvis conversations — starting with in-game `!g`
  # turns (player message, intent, Garvis's reply, claude session id, success,
  # latency, cost). The garvis-bot HOST process (a systemd service — NOT part of this
  # compose) connects over the localhost-published port, which is why 5432 is bound to
  # 127.0.0.1 only and never reachable off-box. Discord turns can be backfilled later
  # (Discord already retains its own chat history), so the schema is source-tagged.
  # The schema itself is created idempotently by the bot at startup
  # (apps/garvis-bot/src/convlog.js), so this service only provides an empty database.
  postgres:
    image: postgres:17
    container_name: mc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-garvis}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-garvis}"   # set a strong value in .env (port is localhost-only, but still)
      POSTGRES_DB: "${POSTGRES_DB:-garvis}"
      TZ: "${TZ:-UTC}"
    ports:
      - "127.0.0.1:5432:5432"                  # localhost-only; the bot runs on the host, not in this compose
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-garvis} -d ${POSTGRES_DB:-garvis}"]
      interval: 15s
      timeout: 5s
      retries: 5

  # --- CraftOS agent tunnel (garvtunnel) -------------------------------------
  # SSH-style bridge that lets the maintainer's agent run Lua inside an in-game
  # CC: Tweaked computer. The computer dials OUT to this sidecar over the internal
  # compose network (ws://garvtunnel:8176/agent) — there is NO inbound port into
  # the game. Two planes share one Node process (see garvtunnel/server.js):
  #   * :8176  WS + GET /client.lua bootstrap — INTERNAL ONLY (not published).
  #            The minecraft container reaches it by the `garvtunnel` service name.
  #   * :8175  control plane (POST /exec, GET /status) — published to 127.0.0.1
  #            ONLY, so only an on-box process (the agent via curl) can submit code.
  # Both planes require the shared secret TUNNEL_TOKEN (set a strong one in .env).
  #
  # PREREQUISITE (one-time): CC: Tweaked's http rules deny "$private" by default,
  # which blocks this internal address. Add an `allow` rule for host "garvtunnel"
  # ABOVE the "$private" deny in server-data/config/computercraft-server.toml and
  # restart the minecraft container. See docs/craftos-tunnel.md.
  garvtunnel:
    build: ./garvtunnel
    container_name: mc-garvtunnel
    restart: unless-stopped
    environment:
      TUNNEL_TOKEN: "${TUNNEL_TOKEN:?set TUNNEL_TOKEN in apps/server/.env}"
      TUNNEL_EXEC_TIMEOUT_MS: "${TUNNEL_EXEC_TIMEOUT_MS:-15000}"
    ports:
      - "127.0.0.1:8175:8175"                  # control plane, host-only (WS port 8176 stays internal)

  # --- Jumbotron video encoder (stadiumcast) ---------------------------------
  # sanjuuni (video → ComputerCraft frames) for the Pokémon-stadium jumbotron.
  # Idles until the host launches an encode/serve job via `docker exec` — a
  # sanjuuni WebSocket server on :8177 that in-game computer 10 pulls frames
  # from (ws://stadiumcast:8177, internal network only, nothing published).
  # Also serves the channel control API on :8178 (channels.js) — the in-game
  # picker in jumboplay.lua GETs the catalog and tunes through it; the existing
  # per-HOST allow-rule below covers it, no port rule needed.
  # PREREQUISITE: CC http allow-rule for host "stadiumcast" ABOVE the
  # "$private" deny in server-data/config/computercraft-server.toml (NeoForge
  # hot-reloads it — no restart). ./stadiumcast/media is mounted for clips; the
  # live GarvisCam capture chain (task: in-game camera) will feed this too.
  stadiumcast:
    build: ./stadiumcast
    container_name: mc-stadiumcast
    restart: unless-stopped
    # Backstop for the sanjuuni frame-store leak (see the "Leak guard" comment in
    # stadiumcast/entrypoint.sh). Unbounded, it reached 94GB and swap-killed the
    # whole host on 2026-07-24. The entrypoint now parks unwatched feeds and
    # recycles at 1GB, so this cap should never be reached — but if it is, docker
    # kills the container and `restart: unless-stopped` rebuilds it in seconds,
    # instead of the Minecraft server dying. memswap_limit == mem_limit so it
    # can't spill into swap either, which is what actually took the box down.
    mem_limit: 2g
    memswap_limit: 2g
    environment:
      CAST_AUTOSTART: "1"                       # live sanjuuni loop (:8180 in, :8177 ws out)
      CAST_CTL: "1"                             # channel catalog + control API on :8178
      # Jumbotron frame size, in sanjuuni pixels = wall chars x (2 wide, 3 tall)
      # at termtv.lua's 0.5 textScale. The wall was rebuilt on 2026-07-26 — bottom
      # face removed, the four remaining enlarged to a uniform 271x152 — so the old
      # 542x414 (the previous modal face, 271x138) left a 7-row black band top and
      # bottom. A mismatch never errors: termtv centres the frame, letterboxing
      # when the face is taller and cropping when it's smaller.
      CAST_W: "542"
      CAST_H: "456"
      # TV audio for the stadium speakers: its own ffmpeg -> DFPWM -> ws :8179,
      # consumed by whichever computer holds the speakers — computer 10's own, in
      # practice, and it IS audible at the seats even though the wall is a Sable
      # moving structure whose blocks sit 20M blocks out in the overworld (Sable
      # simulates it at the stadium, sound included; owner confirmed 2026-07-26).
      # CAST_AUDIO: "0" mutes the whole stadium here.
      CAST_AUDIO: "1"
      # Seconds of audio buffered before playback. Doubles as the A/V offset (the
      # faces run behind live) AND the underrun guard: HLS delivers ~6s segments in
      # one burst, so anything shallower than the segment period stutters forever.
      # 8 was shallower than Bloomberg's own ~10s segments and the set logged 68
      # buffering gaps in 10 minutes; 16 clears the segment period with margin.
      # `[`/`]` at the set moves it live if a channel wants something else.
      CAST_AUDIO_DELAY: "16"
      # Feed rate for the faces, held just UNDER what they can actually draw
      # (measured 4.66fps on 2026-07-25, once termtv.lua replaced jumboplay's
      # poll-then-fetch protocol with one round trip per frame — the old ceiling
      # was 3-4). Same rule as TERMTV_FPS below. Above the draw rate the FIFO
      # backs up, ffmpeg blocks, and a LIVE source can't catch up again: the
      # picture walks steadily behind the live edge while the audio leg stays on
      # it, so the sound slides AHEAD of the picture. Under it, the client waits
      # on the encoder instead and both hold station.
      CHANNEL_FPS: "4"
      # termtv — a second, small screen (one monitor + speaker on one computer,
      # running termtv.lua) fed by its own leg: video ws :8182, audio ws :8183.
      # Independent pipeline, so it can't stall the jumbotron; same tuned channel.
      # TERMTV_W/H must match the monitor at termtv.lua's 0.5 textScale
      # (cols*2 x rows*3, even numbers) — 79x38 chars is the default below.
      TERMTV: "1"
      TERMTV_W: "158"
      TERMTV_H: "114"
      # Just UNDER what the set can actually draw (measured 8.9fps: 38 blit rows
      # plus DFPWM decoding, one round trip per frame, each costing a server
      # tick). Above the draw rate, sanjuuni banks the frames the client never
      # asks for — measured +22MB/min — and the picture slides steadily behind
      # live while the audio leg stays at the live edge, so the sound drifts
      # AHEAD of the picture until the RSS guard recycles the pipeline. Under it,
      # the client waits on the server instead and both stay put.
      TERMTV_FPS: "8"
    volumes:
      - ./stadiumcast/media:/media

  # --- Stadium camera operator (garviscam) -----------------------------------
  # Headless modded Minecraft client (Xvfb + llvmpipe) that joins the server as
  # the whitelisted GarvisCam account and hovers over the Pokémon stadium as a
  # spectator. ffmpeg captures its view; stadiumcast (sanjuuni) encodes it for
  # the jumbotron. Idles until driven via `docker exec` (scripts in
  # ./garviscam/scripts/: install.sh, launch.sh [offline|online], snap.sh).
  # Online mode needs a one-time `portablemc login` (MSA device flow) — the
  # session persists in the garviscam-data volume. GARVISCAM_LOGIN in .env.
  garviscam:
    build: ./garviscam
    container_name: mc-garviscam
    restart: unless-stopped
    shm_size: "1g"
    environment:
      GARVISCAM_LOGIN: "${GARVISCAM_LOGIN:-}"
      XVFB_RES: "960x540"
      CAM_AUTOSTART: "1"                        # supervise client + capture (camloop.sh)
      GARVIS_STREAM: "${GARVIS_STREAM:-1}"      # web-stream kill switch (camloop stream_loop → owncast)
      OWNCAST_STREAM_KEY: "${OWNCAST_STREAM_KEY:-}"
    volumes:
      - garviscam-data:/data
      - ../client:/pack:ro

  # --- Garvis TV (Owncast web stream) -----------------------------------------
  # Self-hosted Twitch-style watch page for the GarvisCam POV — video + game
  # audio, live chat, viewer count, proper offline screen. garviscam's
  # stream_loop pushes RTMP over the compose network (owncast:1935, NOT
  # published). The web page reaches friends via the HOST's cloudflared tunnel
  # (user unit writing-tunnel.service, ~/.cloudflared/config.yml):
  # https://tv.starting.cc → localhost:8088 — no router port forward, hence
  # the 127.0.0.1 bind. Admin panel at /admin (user "admin", password
  # OWNCAST_ADMIN_PASSWORD). -streamkey is "temporary for this session" by
  # design: re-asserted from .env on every container start, so the .env value
  # is always the truth.
  # Page BRANDING (Garvis TV name/logo/theme/about, owncast chrome hidden) is
  # config-state in the owncast-data volume — ./owncast/brand.sh is its source
  # of truth (idempotent; re-run after any volume wipe).
  owncast:
    image: owncast/owncast:0.2.5
    container_name: mc-owncast
    restart: unless-stopped
    command: ["-streamkey", "${OWNCAST_STREAM_KEY:?set OWNCAST_STREAM_KEY in apps/server/.env}",
              "-adminpassword", "${OWNCAST_ADMIN_PASSWORD:?set OWNCAST_ADMIN_PASSWORD in apps/server/.env}"]
    ports:
      - "127.0.0.1:8088:8080"                  # tunnel-only — cloudflared on the host is the sole consumer
    volumes:
      - owncast-data:/app/data

  # --- Garvis TV tollbooth (pay to command Garvis) ------------------------------
  # Stream viewers buy command credits in USDC — Base Pay checkout (/pay) for
  # humans on phones, x402 (HTTP 402, /buy) for agents — and spend them in the
  # Owncast stream chat: !redeem <code>, then "!g mine some iron" etc. This
  # sidecar sells codes + gates the chat commands into a Postgres queue; the
  # HOST garvis-bot (src/streamchat.js) is the executor — body/tv verbs run
  # their validated fast paths, everything else goes to the rcon-empowered
  # agent (game-scoped console, host-RCE boundary unchanged; only modreq is
  # refused). Public side rides the SAME cloudflared tunnel as
  # owncast via a path route (https://tv.starting.cc/tollbooth → :8090); the
  # Owncast webhook lands on :8091 which is compose-internal ONLY (a forged
  # "chat" post can't arrive via the tunnel). Default network = Base Sepolia
  # TESTNET; mainnet = X402_NETWORK=eip155:8453 + a mainnet facilitator + the
  # owner's own X402_PAY_TO wallet.
  tollbooth:
    build: ./tollbooth
    container_name: mc-tollbooth
    restart: unless-stopped
    environment:
      TOLLBOOTH_PG_URL: "postgres://${POSTGRES_USER:-garvis}:${POSTGRES_PASSWORD:-garvis}@postgres:5432/${POSTGRES_DB:-garvis}"
      OWNCAST_URL: "http://owncast:8080"
      OWNCAST_BOT_TOKEN: "${OWNCAST_BOT_TOKEN:?set OWNCAST_BOT_TOKEN in apps/server/.env}"
      X402_PAY_TO: "${X402_PAY_TO:?set X402_PAY_TO in apps/server/.env}"
      X402_NETWORK: "${X402_NETWORK:-eip155:84532}"
      X402_FACILITATOR_URL: "${X402_FACILITATOR_URL:-https://x402.org/facilitator}"
      # CDP API keys switch the facilitator to Coinbase's hosted one (required
      # for mainnet; the keyless x402.org facilitator is testnet-only)
      CDP_API_KEY_ID: "${CDP_API_KEY_ID:-}"
      CDP_API_KEY_SECRET: "${CDP_API_KEY_SECRET:-}"
      TOLLBOOTH_PRICE_USD: "${TOLLBOOTH_PRICE_USD:-1.00}"
      TOLLBOOTH_CREDITS: "${TOLLBOOTH_CREDITS:-2}"           # 50¢/command — two for a dollar
      PUBLIC_URL: "https://tv.starting.cc/tollbooth"
      STREAM_URL: "https://tv.starting.cc"
    ports:
      - "127.0.0.1:8090:8090"                  # tunnel-only (path route) — webhook :8091 stays internal
    depends_on:
      - postgres
      - owncast

  # --- The client you play from the phone (playclient) -------------------------
  # garviscam's sibling: same modded NeoForge client, same pack, but drawn on the
  # HOST's X session (:1) with hardware GL ("NVIDIA GB10/PCIe", direct rendering)
  # instead of Xvfb+llvmpipe. Sunshine (below) captures that display, so this is
  # the thing you are actually looking at on the phone.
  #
  # Reaches the server as `minecraft:25565` over the compose network — that is
  # the address to type into the in-game server list.
  #
  # Idles by default; driven with `docker exec` (see ./playclient/scripts/).
  # Set PLAY_AUTOSTART=1 once you're happy with it so the game is already
  # running when you connect from the phone with no laptop in reach.
  playclient:
    build: ./playclient
    container_name: mc-playclient
    restart: unless-stopped
    shm_size: "2g"
    ipc: host                                  # MIT-SHM against the host's X server
    # Controller path: Sunshine creates its virtual gamepad on the HOST only
    # when a Moonlight session attaches one — i.e. mid-session, after this
    # container exists — so a static `devices:` list can never name the node.
    # Bind the whole directory and open input's char-major via cgroup instead;
    # GLFW/Controlify then sees the pad appear through inotify hotplug.
    device_cgroup_rules:
      - "c 13:* rmw"                           # char major 13 = input subsystem (event*, js*)
    environment:
      DISPLAY: "${SUNSHINE_DISPLAY:-:1}"
      XAUTHORITY: "/run/user/1000/gdm/Xauthority"
      PULSE_SERVER: "unix:/run/user/1000/pulse/native"   # game audio → host sink → Sunshine picks it up
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "all"        # graphics, not just compute — this is what makes GL work
      PLAYCLIENT_LOGIN: "${PLAYCLIENT_LOGIN:-}"
      PLAY_RES: "${PLAY_RES:-2560x1080}"
      PLAY_AUTOSTART: "${PLAY_AUTOSTART:-0}"
    volumes:
      - playclient-data:/data
      - ../client:/pack:ro
      - /dev/input:/dev/input                  # gamepad passthrough — see device_cgroup_rules above
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      # X cookie via an on-disk copy, NOT gdm's own /run/user/1000/gdm/Xauthority.
      # That path is tmpfs, so it is empty at boot — and Docker materialises a
      # missing bind-mount source as a root-owned DIRECTORY, which then blocks gdm
      # from writing the real cookie and bounces every graphical login straight
      # back to the greeter (cost an evening on 2026-07-29). $HOME is on disk, so
      # this survives reboots; i3 refreshes it at session start (~/.config/i3/config).
      - ${HOME}/.docker-xauth:/run/user/1000/gdm/Xauthority:ro
      - /run/user/1000/pulse:/run/user/1000/pulse
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, video, display, graphics, utility, compute]

  # --- Phone streaming (Sunshine → Moonlight on the iPhone) --------------------
  # Play the REAL modded client from an iPhone. Not Geyser/Bedrock (Geyser only
  # translates SERVER-side mods, so Cobblemon — the whole point of this server —
  # is invisible to a Bedrock client) and not a Java launcher on the phone
  # (needs sideloading + JIT, and the pack wants ~4GB). Instead: the client runs
  # HERE on the GB10, and only H.264 frames go to the phone.
  #
  # Transport is TAILSCALE (iphone171 100.120.0.72 ⇄ spark-4933 100.126.150.5,
  # direct, ~41ms) — deliberately no router port forward, since UDP forwarding
  # on this router has never worked (cf. the Simple Voice Chat revert).
  #
  # Capture is X11 against gdm's existing Xorg on :1 (proprietary NVIDIA driver,
  # 2560x1080 ultrawide on USB-C-0), NOT KMS — see ./sunshine/sunshine.conf for
  # why that choice avoids a kernel-param change, a reboot, and a dummy plug.
  #
  # network_mode: host — Moonlight wants a wide TCP+UDP port range (47984-48010)
  # and mDNS discovery; host networking is the sane way to serve that, and it
  # puts the listener on tailscale0. ipc: host — X11 capture uses MIT-SHM, which
  # needs the host IPC namespace. user 0:0 — /dev/uinput is root:root 0600, and
  # Sunshine needs it to synthesise the virtual keyboard/mouse/gamepad.
  #
  # The web UI (https://<tailscale-ip>:47990) is where you set the login and
  # confirm the PIN when pairing the phone. See ./sunshine/README.md.
  sunshine:
    build: ./sunshine                          # upstream's arm64 image is missing libs — see ./sunshine/Dockerfile
    container_name: mc-sunshine
    restart: unless-stopped
    network_mode: host
    ipc: host
    user: "0:0"
    cap_add:
      - SYS_ADMIN                               # KMS capture: open the DRM device and read the scanout plane
    command: ["/config/sunshine.conf"]
    environment:
      DISPLAY: "${SUNSHINE_DISPLAY:-:1}"
      XAUTHORITY: "/run/user/1000/gdm/Xauthority"
      PULSE_SERVER: "unix:/run/user/1000/pulse/native"
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "all"        # need video (NVENC) + graphics/display, not just compute
    devices:
      - /dev/uinput                            # virtual kbd/mouse/gamepad injected into seat0
      - /dev/dri
    volumes:
      - sunshine-config:/config                # pairing certs, credentials, state
      - ./sunshine/sunshine.conf:/config/sunshine.conf   # repo file is the source of truth; edit + restart
      - ./sunshine/apps.json:/config/apps.json           # ditto — Moonlight's app list (web-UI app edits won't stick)
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - ${HOME}/.docker-xauth:/run/user/1000/gdm/Xauthority:ro   # on-disk copy — see playclient above for why
      - /run/user/1000/pulse:/run/user/1000/pulse
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, video, display, graphics, utility, compute]

volumes:
  prometheus-data:                              # Prometheus TSDB (survives restarts)
  grafana-data:                                 # Grafana's own db: users, dashboard edits, prefs
  postgres-data:                                # Garvis conversation log (survives restarts)
  garviscam-data:                               # GarvisCam client: game files, pack, MSA session
  owncast-data:                                 # Garvis TV: owncast config/db (stream title, chat history)
  restic-cache:                                 # offsite backup sidecar: restic's local cache (perf only)
  sunshine-config:                              # Sunshine: web-UI login, pairing certs, client state
  playclient-data:                              # phone client: game files, pack, MSA session
